# golangci-lint v2 config.
#
# Run in CI by the `lint` job in .github/workflows/ci.yml as a REQUIRED gate.
# The inherited lint debt has been burned down and the tree runs clean; new
# findings fail the build. Keep it that way; don't add nolint blankets.
#
# Locally: `golangci-lint run ./...`
version: "2"

linters:
  # Default set: errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  settings:
    errcheck:
      # Encode/Fprintf write to an http.ResponseWriter or SSE stream; by the
      # time they fail the status line is already flushed, so there is nothing
      # to recover. Meaningful errors (os.WriteFile, os.MkdirAll, json.Unmarshal,
      # db.Exec, Tx.Rollback, stdin.Write, io.Copy, …) are still checked.
      exclude-functions:
        - (*encoding/json.Encoder).Encode
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    generated: lax
    paths:
      - web/.output
      - web/node_modules
    rules:
      # Close() is deferred cleanup across many concrete types (*sql.Rows,
      # *os.File, *http.Server, the sqlite pool, fsnotify watcher, …). A failed
      # close on a read path or finished request is not actionable; excluding by
      # source keeps this from devolving into a brittle per-type allowlist.
      - linters: [errcheck]
        source: '\.Close\(\)'
      # SA5011 after a t.Fatal guard is a false positive, and a moving one.
      # The pattern is `if x == nil { t.Fatal(...) }` followed by a use of x:
      # t.Fatal ends the goroutine, so the dereference cannot run with a nil
      # pointer. staticcheck only knows that when it resolves testing.T's
      # noreturn fact, and it does not do so reliably here: the same commit
      # passed on one run and failed on the next, naming different files each
      # time, while the whole tree reports 0 issues locally under the same
      # golangci-lint and Go versions with a cold cache.
      #
      # Scoped to _test.go and to this one check on purpose. It is not a nolint
      # blanket: production code keeps SA5011, and every other check keeps test
      # files. Chasing the sites one by one was tried first and does not
      # converge, because the set that gets reported changes between runs.
      - linters: [staticcheck]
        text: 'SA5011'
        path: '_test\.go'

formatters:
  enable:
    - gofmt
